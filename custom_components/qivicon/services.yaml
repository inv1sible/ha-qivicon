send_item_command:
  name: Send item command
  description: Send a raw command to any QIVICON item. Use the qivicon_item attribute to identify the target.
  fields:
    item:
      name: Item
      description: Exact QIVICON item name.
      required: true
      example: hue_0100_001788a6e2c1_4_brightness
      selector:
        text:
    command:
      name: Command
      description: Raw command accepted by the QIVICON item.
      required: true
      example: "25"
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: Required only when more than one QIVICON Home Base is configured.
      required: false
      selector:
        text:

start_event_capture:
  name: Start event capture
  description: Capture raw QIVICON events for diagnostics for a limited time.
  fields:
    duration:
      name: Duration
      description: Capture duration in seconds, between 10 and 600.
      required: true
      default: 120
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: seconds
          mode: box
    entry_id:
      name: Config entry ID
      description: Required only when more than one QIVICON Home Base is configured.
      required: false
      selector:
        text:

stop_event_capture:
  name: Stop event capture
  description: Stop the active QIVICON diagnostic event capture.
  fields:
    entry_id:
      name: Config entry ID
      description: Required only when more than one QIVICON Home Base is configured.
      required: false
      selector:
        text:
